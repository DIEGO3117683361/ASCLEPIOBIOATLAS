<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCLEPIO VISION</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #ffffff;
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      background: #000;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo {
      position: absolute;
      top: 1rem;
      right: 2rem;
      font-weight: bold;
      letter-spacing: 5px;
      font-size: 1.2rem;
    }

    .container {
      background: #f5f5f5;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid #000;
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    button {
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 10px;
      background: #000;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background: #333;
    }

    .result {
      margin-top: 2rem;
      text-align: center;
      white-space: pre-wrap;
      background-color: #fff;
      padding: 1rem;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      color: #000;
    }

    .result img {
      margin-top: 1rem;
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #000;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 1rem auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo">V I S I O N</div>
  <h1>ASCLEPIO VISION</h1>
  <div class="container">
    <input type="text" id="prompt" placeholder="Describe tu imagen...">
    <button onclick="generarRespuesta()">Enviar Prompt</button>

    <div class="result" id="resultado">
      <!-- Aquí aparecerá la respuesta de la API -->
    </div>
  </div>

  <script>
    async function generarRespuesta() {
      const prompt = document.getElementById("prompt").value;
      const resultadoDiv = document.getElementById("resultado");
      resultadoDiv.innerHTML = '<div class="loader"></div><p>Creando imagen... 🧠💭</p>';

      try {
        const response = await fetch('https://magicloops.dev/api/loop/1672deeb-46fb-4017-a9ce-2251502f19b2/run', {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt: prompt })
        });

        const data = await response.json();
        const respuestaTexto = JSON.stringify(data, null, 2);
        const urlRegex = /(https?:\/\/.+?\.(?:png|jpg|jpeg|gif|webp))(\?[^\s"']*)?/gi;
        const match = urlRegex.exec(respuestaTexto);
        const imageUrl = match ? match[0] : null;

        if (imageUrl) {
          resultadoDiv.innerHTML = `<p><strong>Prompt:</strong> ${prompt}</p>` +
                                   `<p><strong>Respuesta:</strong></p><pre>${respuestaTexto}</pre>` +
                                   `<img src="${imageUrl}" alt="Imagen generada">`;
        } else {
          resultadoDiv.innerHTML = `<p><strong>Prompt:</strong> ${prompt}</p><pre>${respuestaTexto}</pre>`;
        }

      } catch (error) {
        resultadoDiv.innerHTML = "Hubo un error al conectar con la API. 🚨\n" + error.message;
        console.error(error);
      }
    }
  </script>
</body>
</html>
