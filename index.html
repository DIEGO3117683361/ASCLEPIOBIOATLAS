<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCLEPIO VISION</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Variables y reset */
    :root {
      --dark-bg: #121212;
      --dark-sidebar: #1e1e1e;
      --dark-border: #333;
      --light-bg: #f5f5f5;
      --light-sidebar: #ffffff;
      --light-border: #ddd;
      --primary-text: #fff;
      --secondary-text: #999;
      --dark-text: #000;
      --accent-color: #09f;
      --button-bg: #333;
      --button-hover: #555;
      --error-color: #ff4444;
      --shadow: 0 8px 30px rgba(0,0,0,0.3);
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    /* Estructura principal */
    body {
      display: flex;
      min-height: 100vh;
      background-color: var(--dark-bg);
      color: var(--primary-text);
      transition: var(--transition);
      position: relative;
    }

    body.light-mode {
      background-color: var(--light-bg);
      color: var(--dark-text);
    }

    /* Sidebar */
    .sidebar {
      width: 300px;
      min-width: 300px;
      background: var(--dark-sidebar);
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid var(--dark-border);
      transition: var(--transition);
      height: 100vh;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    body.light-mode .sidebar {
      background: var(--light-sidebar);
      border-color: var(--light-border);
    }

    .sidebar.hidden {
      transform: translateX(-100%);
      position: absolute;
    }

    .sidebar h2 {
      font-size: 1.25rem;
      margin-bottom: 1.5rem;
      font-weight: 600;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--dark-border);
    }

    body.light-mode .sidebar h2 {
      border-bottom-color: var(--light-border);
    }

    .history-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .history-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
    }

    .history-img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid var(--dark-border);
    }

    body.light-mode .history-img {
      border-color: var(--light-border);
    }

    .history-img:hover {
      transform: scale(1.03);
      box-shadow: var(--shadow);
    }

    .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: var(--transition);
    }

    .history-item:hover .delete-btn {
      opacity: 1;
    }

    /* Contenido principal */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 3rem 2rem 2rem;
      min-height: 100vh;
      position: relative;
      transition: var(--transition);
    }

    .sidebar.hidden + .main {
      padding-left: 2rem;
    }

    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin-bottom: 3rem;
      text-align: center;
      padding-top: 1rem;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: 0.2rem;
    }

    .header p {
      font-size: 1rem;
      color: var(--secondary-text);
      max-width: 600px;
      margin-bottom: 2rem;
    }

    body.light-mode .header p {
      color: #666;
    }

    /* Controles */
    .controls {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .toggle-sidebar-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: var(--button-bg);
      color: var(--primary-text);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      z-index: 20;
      transition: var(--transition);
    }

    .toggle-sidebar-btn:hover {
      background: var(--button-hover);
    }

    .toggle-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .toggle-switch input {
      cursor: pointer;
    }

    /* Área de entrada */
    .input-container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .input-area {
      display: flex;
      gap: 15px;
      width: 100%;
      margin-bottom: 2rem;
    }

    .input-area input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.1);
      color: var(--primary-text);
      transition: var(--transition);
    }

    body.light-mode .input-area input {
      background: rgba(0, 0, 0, 0.05);
      color: var(--dark-text);
    }

    .input-area input:focus {
      outline: none;
      box-shadow: 0 0 0 2px var(--accent-color);
    }

    .input-area button {
      padding: 14px 24px;
      background: var(--button-bg);
      color: var(--primary-text);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 500;
      white-space: nowrap;
    }

    .input-area button:hover {
      background: var(--button-hover);
    }

    .input-area button:disabled {
      background: #666;
      cursor: not-allowed;
    }

    /* Resultados */
    .image-display {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .image-display img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 12px;
      box-shadow: var(--shadow);
      object-fit: contain;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .image-display img.visible {
      opacity: 1;
      transform: scale(1);
    }

    .download-btn {
      margin-top: 1.5rem;
      padding: 10px 20px;
      background: var(--button-bg);
      color: var(--primary-text);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    .download-btn:hover {
      background: var(--button-hover);
    }

    /* Loader */
    .loader {
      border: 6px solid rgba(204, 204, 204, 0.3);
      border-top: 6px solid var(--accent-color);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: var(--secondary-text);
      font-size: 0.875rem;
      margin-top: 10px;
    }

    /* Efecto mágico */
    @keyframes magicalAppearance {
      0% {
        opacity: 0;
        transform: scale(0.8) rotate(-5deg);
        filter: blur(2px) brightness(1.5);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
        filter: blur(0) brightness(1);
      }
    }

    .magical {
      animation: magicalAppearance 0.8s ease-out forwards;
    }

    /* Contador y límite */
    .counter-info {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--secondary-text);
    }

    .limit-reached {
      color: var(--error-color);
      font-weight: 500;
      margin-top: 1rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        width: 250px;
        min-width: 250px;
      }
      
      .header h1 {
        font-size: 2rem;
      }
      
      .input-area {
        flex-direction: column;
      }
      
      .history-container {
        grid-template-columns: 1fr;
      }
      
      .main {
        padding: 2.5rem 1.5rem 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .main {
        padding: 2rem 1rem 1rem;
      }
      
      .controls {
        top: 15px;
        right: 15px;
      }
      
      .toggle-sidebar-btn {
        top: 15px;
        left: 15px;
      }
      
      .header {
        margin-bottom: 2rem;
      }
      
      .header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <h2>Historial de imágenes</h2>
    <div class="history-container" id="history"></div>
  </div>

  <div class="main">
    <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>
    
    <div class="controls">
      <div class="toggle-switch">
        <label>
          <input type="checkbox" id="modeToggle" /> Modo claro
        </label>
      </div>
    </div>
    
    <div class="header">
      <h1>ASCLEPIO VISION</h1>
      <p>Transforma tus ideas en imágenes con inteligencia artificial</p>
    </div>
    
    <div class="input-container">
      <div class="input-area">
        <input type="text" id="prompt" placeholder="Describe la imagen que deseas generar..." />
        <button id="generateBtn">Generar</button>
      </div>
      
      <div class="counter-info" id="counterInfo"></div>
      <div class="limit-reached" id="limitReached" style="display: none;">
        Has alcanzado el límite de generaciones. Por favor espera 8 horas antes de generar más imágenes.
      </div>
      
      <div class="image-display" id="display">
        <div id="loader" class="loader" style="display: none;"></div>
        <div id="loadingText" class="loading-text"></div>
      </div>
    </div>
  </div>

  <script>
    // Elementos del DOM
    const historyDiv = document.getElementById('history');
    const display = document.getElementById('display');
    const loader = document.getElementById('loader');
    const modeToggle = document.getElementById('modeToggle');
    const generateBtn = document.getElementById('generateBtn');
    const loadingText = document.getElementById('loadingText');
    const sidebar = document.getElementById('sidebar');
    const promptInput = document.getElementById('prompt');
    const counterInfo = document.getElementById('counterInfo');
    const limitReached = document.getElementById('limitReached');

    // Variables de estado
    let generationCount = 0;
    let lastGenerationTime = null;
    const MAX_GENERATIONS = 5;
    const COOLDOWN_HOURS = 8;

    // Event Listeners
    modeToggle.addEventListener('change', toggleMode);
    generateBtn.addEventListener('click', generateImage);
    promptInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') generateImage();
    });

    // Cargar datos al iniciar
    document.addEventListener('DOMContentLoaded', () => {
      loadImagesFromLocalStorage();
      loadGenerationData();
      updateCounterUI();
      
      // Verificar modo claro preferido
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        modeToggle.checked = true;
        document.body.classList.add('light-mode');
      }
    });

    // Funciones principales
    function toggleMode() {
      document.body.classList.toggle('light-mode');
    }

    function toggleSidebar() {
      sidebar.classList.toggle('hidden');
    }

    function loadGenerationData() {
      const savedData = localStorage.getItem('asclepioGenerationData');
      if (savedData) {
        const data = JSON.parse(savedData);
        generationCount = data.count || 0;
        lastGenerationTime = data.lastTime ? new Date(data.lastTime) : null;
      }
    }

    function saveGenerationData() {
      const data = {
        count: generationCount,
        lastTime: new Date().toISOString()
      };
      localStorage.setItem('asclepioGenerationData', JSON.stringify(data));
    }

    function canGenerateMore() {
      // Si no ha generado nada o no ha alcanzado el límite
      if (generationCount < MAX_GENERATIONS) return true;
      
      // Si alcanzó el límite, verificar si han pasado 8 horas
      if (lastGenerationTime) {
        const now = new Date();
        const diffHours = (now - new Date(lastGenerationTime)) / (1000 * 60 * 60);
        return diffHours >= COOLDOWN_HOURS;
      }
      
      return true;
    }

    function resetGenerationCount() {
      generationCount = 0;
      lastGenerationTime = null;
      saveGenerationData();
      updateCounterUI();
      limitReached.style.display = 'none';
      generateBtn.disabled = false;
    }

    function updateCounterUI() {
      counterInfo.textContent = `Generaciones hoy: ${generationCount}/${MAX_GENERATIONS}`;
      
      if (generationCount >= MAX_GENERATIONS) {
        if (canGenerateMore()) {
          resetGenerationCount();
        } else {
          limitReached.style.display = 'block';
          generateBtn.disabled = true;
          
          // Calcular cuándo se podrá generar de nuevo
          const nextGenTime = new Date(lastGenerationTime);
          nextGenTime.setHours(nextGenTime.getHours() + COOLDOWN_HOURS);
          const options = { hour: '2-digit', minute: '2-digit' };
          const timeStr = nextGenTime.toLocaleTimeString('es-ES', options);
          
          limitReached.textContent += ` Podrás generar de nuevo a las ${timeStr}.`;
        }
      }
    }

    async function generateImage() {
      if (!canGenerateMore()) {
        alert("Has alcanzado el límite de generaciones. Por favor espera 8 horas antes de generar más imágenes.");
        return;
      }

      const prompt = promptInput.value.trim();
      if (!prompt) {
        alert("Por favor ingresa una descripción");
        return;
      }

      // Mostrar estado de carga
      loader.style.display = 'block';
      loadingText.textContent = 'Generando imagen...';
      display.innerHTML = '';
      display.appendChild(loader);
      display.appendChild(loadingText);
      generateBtn.disabled = true;

      try {
        const response = await fetch('https://magicloops.dev/api/loop/1672deeb-46fb-4017-a9ce-2251502f19b2/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const result = await response.json();
        const match = JSON.stringify(result).match(/https?:\/\/[^"']+/);
        
        if (match) {
          const imageUrl = match[0].replace(/\\/g, '');
          showImage(imageUrl);
          saveToHistory(imageUrl);
          updateLocalStorage(imageUrl);
          
          // Actualizar contador
          generationCount++;
          lastGenerationTime = new Date().toISOString();
          saveGenerationData();
          updateCounterUI();
        } else {
          throw new Error("No se encontró URL de imagen en la respuesta");
        }
      } catch (error) {
        console.error("Error:", error);
        display.innerHTML = `<p class="error">Error al generar la imagen: ${error.message}</p>`;
      } finally {
        loader.style.display = 'none';
        loadingText.textContent = '';
        generateBtn.disabled = false;
      }
    }

    function showImage(url) {
      display.innerHTML = '';
      
      const imgContainer = document.createElement('div');
      imgContainer.style.width = '100%';
      
      const img = document.createElement('img');
      img.src = url;
      img.alt = 'Imagen generada por Asclepio Vision';
      
      const downloadBtn = document.createElement('button');
      downloadBtn.textContent = 'Descargar imagen';
      downloadBtn.className = 'download-btn';
      downloadBtn.onclick = () => downloadImage(url);
      
      imgContainer.appendChild(img);
      imgContainer.appendChild(downloadBtn);
      display.appendChild(imgContainer);
      
      // Aplicar efecto mágico después de un breve retraso para que cargue la imagen
      setTimeout(() => {
        img.classList.add('magical');
        img.classList.add('visible');
      }, 100);
    }

    function downloadImage(url) {
      const a = document.createElement('a');
      a.href = url;
      a.download = `asclepio-${Date.now()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function saveToHistory(url) {
      // Verificar si la imagen ya existe en el historial
      const existingImages = Array.from(historyDiv.querySelectorAll('.history-item'));
      if (existingImages.some(item => item.dataset.url === url)) return;
      
      const item = document.createElement('div');
      item.className = 'history-item';
      item.dataset.url = url;
      
      const img = document.createElement('img');
      img.src = url;
      img.className = 'history-img';
      img.onclick = () => showImage(url);
      img.alt = 'Imagen generada anteriormente';
      
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
      deleteBtn.onclick = (e) => {
        e.stopPropagation();
        deleteFromHistory(url, item);
      };
      
      item.appendChild(img);
      item.appendChild(deleteBtn);
      historyDiv.prepend(item);
      
      // Limitar historial a 20 imágenes
      if (historyDiv.children.length > 20) {
        historyDiv.removeChild(historyDiv.lastChild);
      }
    }

    function deleteFromHistory(url, element) {
      if (confirm("¿Estás seguro de que quieres eliminar esta imagen del historial?")) {
        // Eliminar del DOM
        element.remove();
        
        // Eliminar del localStorage
        const current = JSON.parse(localStorage.getItem('asclepioImages')) || [];
        const updated = current.filter(item => item !== url);
        localStorage.setItem('asclepioImages', JSON.stringify(updated));
      }
    }

    function loadImagesFromLocalStorage() {
      const saved = localStorage.getItem('asclepioImages');
      if (saved) {
        const urls = JSON.parse(saved);
        urls.forEach(url => saveToHistory(url));
      }
    }

    function updateLocalStorage(newUrl) {
      const current = JSON.parse(localStorage.getItem('asclepioImages')) || [];
      
      // Evitar duplicados
      if (!current.includes(newUrl)) {
        current.unshift(newUrl);
        
        // Limitar a 20 elementos en localStorage
        if (current.length > 20) {
          current.pop();
        }
        
        localStorage.setItem('asclepioImages', JSON.stringify(current));
      }
    }
  </script>
</body>
</html>
